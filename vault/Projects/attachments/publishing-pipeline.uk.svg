<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 88" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" role="img" aria-label="Конвеєр публікації: Obsidian → GitHub → Vercel → живий сайт">
  <style>
    .box   { fill: #33373d; fill-opacity: .04; stroke: #33373d; stroke-width: 1.5; }
    .solid { fill: #33373d; stroke: #33373d; stroke-width: 1.5; }
    .lbl   { fill: #33373d; font-size: 15px; font-weight: 600; }
    .sub   { fill: #6b7280; font-size: 12px; }
    .inv   { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .subinv{ fill: #ffffff; fill-opacity: .72; font-size: 12px; }
    .arw   { fill: none; stroke: #8b919b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #e6e8eb; fill-opacity: .05; stroke: #c8ccd2; }
      .solid { fill: #e6e8eb; stroke: #e6e8eb; }
      .lbl { fill: #e6e8eb; }
      .sub { fill: #9aa0aa; }
      .inv, .subinv { fill: #0a0a0a; }
      .arw   { stroke: #737986; }
    }
  </style>

  <rect class="box" x="2" y="12" width="140" height="64" rx="12" />
  <text class="lbl" x="72" y="41" text-anchor="middle">Obsidian</text>
  <text class="sub" x="72" y="60" text-anchor="middle">пишеш нотатку</text>
  <circle class="arw" cx="148.8" cy="44" r="1.8" />
  <path class="arw" d="M150.6 44L165 44M159.5 39C160.2 41.8 162.1 43.4 165 44C162.1 44.6 160.2 46.2 159.5 49" />

  <rect class="box" x="170" y="12" width="140" height="64" rx="12" />
  <text class="lbl" x="240" y="41" text-anchor="middle">GitHub</text>
  <text class="sub" x="240" y="60" text-anchor="middle">автопуш у git</text>
  <circle class="arw" cx="316.8" cy="44" r="1.8" />
  <path class="arw" d="M318.6 44L333 44M327.5 39C328.2 41.8 330.1 43.4 333 44C330.1 44.6 328.2 46.2 327.5 49" />

  <rect class="box" x="338" y="12" width="140" height="64" rx="12" />
  <text class="lbl" x="408" y="41" text-anchor="middle">Vercel</text>
  <text class="sub" x="408" y="60" text-anchor="middle">статична збірка</text>
  <circle class="arw" cx="484.8" cy="44" r="1.8" />
  <path class="arw" d="M486.6 44L501 44M495.5 39C496.2 41.8 498.1 43.4 501 44C498.1 44.6 496.2 46.2 495.5 49" />

  <rect class="solid" x="506" y="12" width="140" height="64" rx="12" />
  <text class="inv" x="576" y="41" text-anchor="middle">kryloss.com</text>
  <text class="subinv" x="576" y="60" text-anchor="middle">онлайн за ~1 хв</text>
</svg>
