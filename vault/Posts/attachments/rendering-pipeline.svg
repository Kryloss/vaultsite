<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" role="img" aria-label="How a note is rendered: an Obsidian note is preprocessed for callouts, embeds, wiki links, progress bars, music and Excalidraw, then run through the unified remark-to-rehype pipeline into HTML styled by prose CSS, producing a static page at build time.">
  <style>
    .box  { fill: none; stroke: #33373d; stroke-width: 1.5; }
    .grp  { fill: none; stroke: #b7bcc4; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .pill { fill: #f4f4f5; stroke: #d3d6db; stroke-width: 1.2; }
    .solid{ fill: #33373d; stroke: #33373d; stroke-width: 1.5; }
    .lbl  { fill: #33373d; font-size: 13.5px; font-weight: 600; }
    .lbl2 { fill: #33373d; font-size: 15px; font-weight: 700; }
    .sub  { fill: #6b7280; font-size: 11px; }
    .mono { fill: #33373d; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .msub { fill: #6b7280; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tag  { fill: #6b7280; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
    .inv  { fill: #ffffff; font-size: 13.5px; font-weight: 700; }
    .cap  { fill: #6b7280; font-size: 11.5px; font-style: italic; }
    .arw  { stroke: #9aa0aa; stroke-width: 1.5; fill: none; }
    .ah   { fill: #9aa0aa; }
    @media (prefers-color-scheme: dark) {
      .box  { stroke: #c8ccd2; }
      .grp  { stroke: #4a4e57; }
      .pill { fill: #17171a; stroke: #33373d; }
      .solid{ fill: #e6e8eb; stroke: #e6e8eb; }
      .lbl  { fill: #e6e8eb; }
      .lbl2 { fill: #f2f3f5; }
      .sub, .msub, .tag, .cap { fill: #9aa0aa; }
      .mono { fill: #e6e8eb; }
      .inv  { fill: #0a0a0a; }
      .arw  { stroke: #6b7280; }
      .ah   { fill: #6b7280; }
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path class="ah" d="M0 0 L6 3 L0 6 Z" />
    </marker>
  </defs>

  <!-- input -->
  <rect class="box" x="300" y="18" width="160" height="52" rx="12" />
  <text class="lbl2" x="380" y="42" text-anchor="middle">Obsidian note</text>
  <text class="sub"  x="380" y="59" text-anchor="middle">.md in the vault</text>
  <text class="tag"  x="712" y="30" text-anchor="end">STATIC · BUILD TIME</text>
  <line class="arw" x1="380" y1="70" x2="380" y2="102" marker-end="url(#ah)" />

  <!-- stage 1: preprocess -->
  <rect class="grp" x="40" y="104" width="680" height="150" rx="14" />
  <text class="tag" x="58" y="126">1 · PREPROCESS  (Obsidian syntax → standard markdown)</text>

  <rect class="pill" x="66"  y="142" width="185" height="42" rx="9" />
  <text class="lbl"  x="158" y="161" text-anchor="middle">Callouts</text>
  <text class="msub" x="158" y="176" text-anchor="middle">&gt; [!note] Title</text>

  <rect class="pill" x="288" y="142" width="185" height="42" rx="9" />
  <text class="lbl"  x="380" y="161" text-anchor="middle">Image embeds</text>
  <text class="msub" x="380" y="176" text-anchor="middle">![[img|300]]</text>

  <rect class="pill" x="510" y="142" width="185" height="42" rx="9" />
  <text class="lbl"  x="602" y="161" text-anchor="middle">Wiki links</text>
  <text class="msub" x="602" y="176" text-anchor="middle">[[Note|label]]</text>

  <rect class="pill" x="66"  y="196" width="185" height="42" rx="9" />
  <text class="lbl"  x="158" y="215" text-anchor="middle">Progress bars</text>
  <text class="msub" x="158" y="230" text-anchor="middle">[progress:: 45]</text>

  <rect class="pill" x="288" y="196" width="185" height="42" rx="9" />
  <text class="lbl"  x="380" y="215" text-anchor="middle">Apple Music</text>
  <text class="msub" x="380" y="230" text-anchor="middle">music.apple.com/…</text>

  <rect class="pill" x="510" y="196" width="185" height="42" rx="9" />
  <text class="lbl"  x="602" y="215" text-anchor="middle">Excalidraw</text>
  <text class="msub" x="602" y="230" text-anchor="middle">![[x.excalidraw]]</text>

  <line class="arw" x1="380" y1="254" x2="380" y2="282" marker-end="url(#ah)" />

  <!-- stage 2: unified pipeline -->
  <rect class="grp" x="40" y="284" width="680" height="98" rx="14" />
  <text class="tag" x="58" y="306">2 · UNIFIED PIPELINE  (remark → rehype)</text>

  <g>
    <rect class="pill" x="66"  y="320" width="90" height="34" rx="8" />
    <text class="mono" x="111" y="341" text-anchor="middle">parse</text>
    <rect class="pill" x="176" y="320" width="90" height="34" rx="8" />
    <text class="mono" x="221" y="341" text-anchor="middle">gfm</text>
    <rect class="pill" x="286" y="320" width="90" height="34" rx="8" />
    <text class="mono" x="331" y="341" text-anchor="middle">rehype</text>
    <rect class="pill" x="396" y="320" width="90" height="34" rx="8" />
    <text class="mono" x="441" y="341" text-anchor="middle">raw</text>
    <rect class="pill" x="506" y="320" width="90" height="34" rx="8" />
    <text class="mono" x="551" y="341" text-anchor="middle">figures</text>
    <rect class="pill" x="616" y="320" width="90" height="34" rx="8" />
    <text class="mono" x="661" y="341" text-anchor="middle">stringify</text>

    <line class="arw" x1="156" y1="337" x2="174" y2="337" marker-end="url(#ah)" />
    <line class="arw" x1="266" y1="337" x2="284" y2="337" marker-end="url(#ah)" />
    <line class="arw" x1="376" y1="337" x2="394" y2="337" marker-end="url(#ah)" />
    <line class="arw" x1="486" y1="337" x2="504" y2="337" marker-end="url(#ah)" />
    <line class="arw" x1="596" y1="337" x2="614" y2="337" marker-end="url(#ah)" />
  </g>

  <line class="arw" x1="380" y1="382" x2="380" y2="426" marker-end="url(#ah)" />

  <!-- output row -->
  <rect class="box" x="96"  y="428" width="150" height="52" rx="12" />
  <text class="lbl2" x="171" y="452" text-anchor="middle">HTML</text>
  <text class="sub"  x="171" y="469" text-anchor="middle">string</text>

  <rect class="box" x="305" y="428" width="150" height="52" rx="12" />
  <text class="lbl2" x="380" y="452" text-anchor="middle">.prose CSS</text>
  <text class="sub"  x="380" y="469" text-anchor="middle">styling</text>

  <rect class="solid" x="514" y="428" width="164" height="52" rx="12" />
  <text class="inv"  x="596" y="458" text-anchor="middle">Rendered page</text>

  <line class="arw" x1="246" y1="454" x2="303" y2="454" marker-end="url(#ah)" />
  <line class="arw" x1="455" y1="454" x2="512" y2="454" marker-end="url(#ah)" />

  <text class="cap" x="380" y="512" text-anchor="middle">Rendered once at build — static HTML on the CDN, nothing runs at request time.</text>
</svg>
