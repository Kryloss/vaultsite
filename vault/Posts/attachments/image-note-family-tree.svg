<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1000" role="img" aria-label="Family tree showing Kyrylo, his sister, parents, aunt, grandparents, and cousins">
  <title>Family tree showing Kyrylo, his sister, parents, aunt, grandparents, and cousins</title>
  <style>
    .branch { fill: none; stroke: #7b7b82; stroke-width: 1.2; stroke-dasharray: 6 7; }
    .family-line { fill: none; stroke: #55555b; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    .junction { fill: #55555b; }
    .card rect { fill: #f3f3f2; stroke: #29292c; stroke-width: 1.35; }
    .anchor rect { fill: none; stroke-width: 1.55; }
    .uncertain rect { fill: none; stroke: #77777d; stroke-dasharray: 5 5; }
    .current rect { fill: #33373d; stroke: #33373d; stroke-width: 1.5; }
    .title, .branch-title, .generation, .name, .role, .note {
      fill: #202023;
      font-family: var(--font-prose, var(--font-source-serif, Georgia, "Times New Roman", serif));
      dominant-baseline: middle;
    }
    .title { font-size: 24px; font-weight: 600; letter-spacing: 1.25px; text-anchor: middle; }
    .branch-title { font-size: 14px; font-weight: 600; letter-spacing: .7px; text-anchor: start; }
    .generation { fill: #6a6a71; font-size: 13px; font-weight: 400; letter-spacing: .65px; text-anchor: start; }
    .name, .role, .note { text-anchor: middle; }
    .name { font-size: 20px; font-weight: 600; }
    .role { fill: #606067; font-size: 14px; font-weight: 400; }
    .cousin .role { font-size: 13.5px; }
    .note { fill: #77777e; font-size: 11.5px; font-style: italic; font-weight: 400; }
    .current .name { fill: #ffffff; }
    .current .role { fill: #d4d4d8; }
    @media (max-width: 420px) {
      .title { font-size: 30px; }
      .branch-title { font-size: 19px; }
      .generation { font-size: 19px; }
      .name { font-size: 25px; }
      .role { font-size: 20px; }
      .cousin .role { font-size: 18px; }
      .note { font-size: 17px; }
    }
    @media (prefers-color-scheme: dark) {
      .branch { stroke: #85858d; }
      .family-line { stroke: #9a9aa2; }
      .junction { fill: #c9c9ce; }
      .card rect { fill: #19191c; stroke: #e4e4e7; }
      .anchor rect { fill: none; stroke: #e4e4e7; }
      .uncertain rect { fill: none; stroke: #9999a1; }
      .current rect { fill: #e6e8eb; stroke: #e6e8eb; }
      .title, .branch-title, .name { fill: #f2f2f3; }
      .generation, .role { fill: #a6a6ae; }
      .note { fill: #8f8f98; }
      .current .name { fill: #0a0a0a; }
      .current .role { fill: #4b4b52; }
    }
  </style>
  <g aria-hidden="true">
    <text class="title" x="375" y="45">MY FAMILY TREE</text>

    <rect class="branch" x="30" y="88" width="345" height="205" rx="16"/>
    <text class="branch-title" x="50" y="116">MATERNAL BRANCH</text>
    <rect class="branch" x="385" y="88" width="335" height="205" rx="16"/>
    <text class="branch-title" x="405" y="116">PATERNAL BRANCH</text>

    <g class="card person">
      <rect x="52" y="145" width="145" height="82" rx="14"/>
      <text class="name" x="124.5" y="179">Valerii</text>
      <text class="role" x="124.5" y="203"><tspan x="124.5" dy="0">Grandfather</tspan></text>
    </g>
    <g class="card person">
      <rect x="208" y="145" width="145" height="82" rx="14"/>
      <text class="name" x="280.5" y="179">Svetlana</text>
      <text class="role" x="280.5" y="203"><tspan x="280.5" dy="0">Grandmother</tspan></text>
    </g>
    <g class="card person uncertain">
      <rect x="397" y="137" width="156" height="98" rx="14"/>
      <text class="name" x="475" y="166">Pavel</text>
      <text class="role" x="475" y="190"><tspan x="475" dy="0">Grandfather</tspan></text>
      <text class="note" x="475" y="211">I don't know him</text>
    </g>
    <g class="card person">
      <rect x="564" y="145" width="135" height="82" rx="14"/>
      <text class="name" x="631.5" y="179">Lubov</text>
      <text class="role" x="631.5" y="203"><tspan x="631.5" dy="0">Grandmother</tspan></text>
    </g>

    <path class="family-line" d="M 124.5 227 V 256 H 202.5 M 280.5 227 V 256 H 202.5 V 318 H 143 M 202.5 318 H 373 M 143 318 V 395 M 373 318 V 395"/>
    <circle class="junction" cx="202.5" cy="256" r="3"/>
    <path class="family-line" d="M 475 235 V 256 H 552 M 631.5 227 V 256 H 552 V 318 H 607 V 395"/>
    <circle class="junction" cx="552" cy="256" r="3"/>

    <text class="generation" x="48" y="365">PARENTS &amp; AUNT</text>
    <g class="card person anchor">
      <rect x="48" y="395" width="190" height="90" rx="14"/>
      <text class="name" x="143" y="429">Viktoria</text>
      <text class="role" x="143" y="453"><tspan x="143" dy="0">Aunt</tspan></text>
    </g>
    <g class="card person anchor">
      <rect x="278" y="395" width="190" height="90" rx="14"/>
      <text class="name" x="373" y="429">Iryna</text>
      <text class="role" x="373" y="453"><tspan x="373" dy="0">Mom</tspan></text>
    </g>
    <g class="card person anchor">
      <rect x="512" y="395" width="190" height="90" rx="14"/>
      <text class="name" x="607" y="429">Volodymyr</text>
      <text class="role" x="607" y="453"><tspan x="607" dy="0">Dad</tspan></text>
    </g>

    <path class="family-line" d="M 468 440 H 512 M 490 440 V 655 H 462 M 490 655 H 635 M 462 655 V 727 M 635 655 V 727"/>
    <circle class="junction" cx="490" cy="440" r="3"/>
    <path class="family-line" d="M 143 485 V 655 H 124 M 143 655 H 290 M 124 655 V 727 M 290 655 V 727"/>
    <circle class="junction" cx="143" cy="655" r="3"/>

    <text class="generation" x="38" y="697">CHILDREN</text>
    <g class="card person cousin">
      <rect x="38" y="727" width="172" height="92" rx="14"/>
      <text class="name" x="124" y="761">Veronika</text>
      <text class="role" x="124" y="785"><tspan x="124" dy="0">Cousin</tspan></text>
    </g>
    <g class="card person cousin">
      <rect x="224" y="727" width="132" height="92" rx="14"/>
      <text class="name" x="290" y="761">Lesya</text>
      <text class="role" x="290" y="785"><tspan x="290" dy="0">Cousin</tspan></text>
    </g>
    <g class="card person current">
      <rect x="382" y="727" width="160" height="92" rx="14"/>
      <text class="name" x="462" y="761">Kyrylo</text>
      <text class="role" x="462" y="785"><tspan x="462" dy="0">Me</tspan></text>
    </g>
    <g class="card person">
      <rect x="556" y="727" width="158" height="92" rx="14"/>
      <text class="name" x="635" y="761">Polina</text>
      <text class="role" x="635" y="785"><tspan x="635" dy="0">Sister</tspan></text>
    </g>
  </g>
</svg>
