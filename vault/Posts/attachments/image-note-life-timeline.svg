<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-label="A source-faithful timeline from Kramatorsk through Romania and Canada to TMU">
  <style>
    .guide { fill: none; stroke: #d6d6d3; stroke-width: 2; }
    .route { fill: none; stroke: #8e9299; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .route-strong { fill: none; stroke: #34383e; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #fff; stroke: #3f4349; stroke-width: 2.2; }
    .node-soft { fill: #f5f5f3; stroke: #9a9da3; stroke-width: 2; }
    .phase { fill: #25292f; font-size: 34px; font-weight: 700; }
    .date { fill: #626770; font-size: 30px; font-weight: 650; letter-spacing: .025em; }
    .label { fill: #34383e; font-size: 34px; font-weight: 650; }
    .label-tight { fill: #34383e; font-size: 30px; font-weight: 650; }
    .small { fill: #626770; font-size: 30px; }
    .event { fill: #25292f; font-size: 34px; font-weight: 700; }
    .dot { fill: #34383e; }
    .arrow { fill: #8e9299; }
    @media (prefers-color-scheme: dark) {
      .guide { stroke: #3f4248; }
      .route { stroke: #717680; }
      .route-strong { stroke: #e2e4e7; }
      .node { fill: #18191b; stroke: #c7cbd1; }
      .node-soft { fill: #222326; stroke: #717680; }
      .phase, .label, .label-tight, .event, .dot { fill: #e7e9ec; }
      .date, .small { fill: #aeb3bc; }
      .arrow { fill: #717680; }
    }
  </style>
  <defs>
    <marker id="life-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path class="arrow" d="M0 0 L9 5 L0 10 Z" />
    </marker>
  </defs>

  <text class="phase" x="40" y="48">KRAMATORSK</text>
  <text class="date" x="680" y="48" text-anchor="end">2007–2022</text>
  <line class="guide" x1="40" y1="67" x2="680" y2="67" />

  <rect class="node" x="40" y="98" width="190" height="88" rx="42" />
  <text class="label-tight" x="135" y="151" text-anchor="middle">Kindergarten</text>
  <line class="route" x1="234" y1="142" x2="266" y2="142" marker-end="url(#life-arrow)" />
  <rect class="node" x="275" y="98" width="170" height="88" rx="42" />
  <text class="label" x="360" y="151" text-anchor="middle">Preschool</text>
  <line class="route" x1="449" y1="142" x2="481" y2="142" marker-end="url(#life-arrow)" />
  <rect class="node" x="490" y="88" width="190" height="108" rx="52" />
  <text class="label" x="585" y="139" text-anchor="middle">School</text>
  <text class="small" x="585" y="172" text-anchor="middle">grades 1–8</text>

  <path class="route" d="M585 199 C585 226 638 230 650 260" marker-end="url(#life-arrow)" />
  <path class="route-strong" d="M40 276 C95 258 143 291 201 274 S307 257 365 276 S474 294 532 275 S625 257 680 276" />
  <circle class="dot" cx="365" cy="276" r="8" />
  <text class="date" x="350" y="237" text-anchor="end">24 FEB 2022</text>
  <text class="event" x="382" y="238">War started</text>

  <text class="phase" x="40" y="355">2022</text>
  <line class="guide" x1="40" y1="374" x2="680" y2="374" />

  <rect class="node-soft" x="40" y="405" width="280" height="125" rx="48" />
  <text class="date" x="180" y="443" text-anchor="middle">17 MAR</text>
  <text class="label" x="180" y="482" text-anchor="middle">Romania</text>
  <text class="small" x="180" y="515" text-anchor="middle">four months</text>
  <line class="route" x1="325" y1="468" x2="391" y2="468" marker-end="url(#life-arrow)" />
  <rect class="node" x="400" y="405" width="280" height="125" rx="48" />
  <text class="date" x="540" y="449" text-anchor="middle">8 JUN</text>
  <text class="label" x="540" y="493" text-anchor="middle">Canada</text>

  <path class="route" d="M540 534 C540 566 328 545 222 587" marker-end="url(#life-arrow)" />
  <rect class="node" x="85" y="590" width="230" height="82" rx="40" />
  <text class="label" x="200" y="641" text-anchor="middle">Nobleton</text>
  <line class="route" x1="319" y1="631" x2="391" y2="631" marker-end="url(#life-arrow)" />
  <rect class="node" x="400" y="590" width="250" height="82" rx="40" />
  <text class="label" x="525" y="641" text-anchor="middle">Newmarket</text>

  <text class="phase" x="40" y="731">2022–2026</text>
  <text class="date" x="680" y="731" text-anchor="end">NOW</text>
  <line class="guide" x1="40" y1="750" x2="680" y2="750" />

  <rect class="node-soft" x="40" y="783" width="300" height="135" rx="48" />
  <text class="label-tight" x="190" y="841" text-anchor="middle">Sacred Heart CHS</text>
  <line class="route" x1="345" y1="850" x2="391" y2="850" marker-end="url(#life-arrow)" />
  <rect class="node" x="400" y="783" width="280" height="135" rx="48" />
  <text class="label" x="540" y="833" text-anchor="middle">TMU</text>
  <text class="small" x="540" y="873" text-anchor="middle">Cyber Science</text>
</svg>
