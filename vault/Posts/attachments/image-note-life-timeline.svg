    <text class="stage-label" x="375" y="66">1 · KRAMATORSK · 2007–2022</text>
    <text class="node-label" x="157.5" y="142.0"><tspan x="157.5" dy="0">Kindergarten</tspan></text>
    <text class="node-label" x="387.5" y="142.0"><tspan x="387.5" dy="0">Preschool</tspan></text>
    <text class="node-label" x="605" y="127.5"><tspan x="605" dy="0">School</tspan><tspan x="605" dy="29.0">(grades 1–8)</tspan></text>
    <text class="stage-label" x="375" y="432">2 · RELOCATION · 2022</text>
    <text class="node-label" x="235" y="484.5"><tspan x="235" dy="0">17 MAR · Romania ·</tspan><tspan x="235" dy="29.0">four months</tspan></text>
