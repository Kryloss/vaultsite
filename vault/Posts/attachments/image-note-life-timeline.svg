    <text class="stage-label" x="375" y="827">4 · EDUCATION IN CANADA</text>
    <text class="node-label" x="230" y="879.5"><tspan x="230" dy="0">2022–2026 · Sacred</tspan><tspan x="230" dy="29.0">Heart CHS</tspan></text>
    <text class="node-label" x="560" y="879.5"><tspan x="560" dy="0">NOW · TMU ·</tspan><tspan x="560" dy="29.0">Cyber Science</tspan></text>
    <text class="rupture-label" x="375" y="315.0"><tspan x="375" dy="0">24 FEB 2022 · War started</tspan></text>
