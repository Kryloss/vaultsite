    <rect class="node" x="90" y="715" width="180" height="70" rx="13"/>
    <rect class="node" x="480" y="715" width="170" height="70" rx="13"/>
    <rect class="node" x="80" y="850" width="285" height="78" rx="13"/>
    <rect class="node destination" x="445" y="850" width="210" height="78" rx="13"/>
    <path class="path" d="M 273 138 L 290 138" marker-end="url(#image-note-arrow-en)"/>
    <path class="path" d="M 498 138 L 515 138" marker-end="url(#image-note-arrow-en)"/>
    <path class="path" d="M 358 511 L 420 511" marker-end="url(#image-note-arrow-en)"/>
    <path class="path" d="M 278 750 L 470 750" marker-end="url(#image-note-arrow-en)"/>
    <path class="path" d="M 373 889 L 435 889" marker-end="url(#image-note-arrow-en)"/>
    <path class="path" d="M 375 233 L 375 262" marker-end="url(#image-note-arrow-en)"/>
    <path class="path" d="M 375 366 L 375 397" marker-end="url(#image-note-arrow-en)"/>
    <path class="path" d="M 375 598 L 375 642" marker-end="url(#image-note-arrow-en)"/>
    <path class="path" d="M 565 793 L 565 817 L 222.5 817 L 222.5 842" marker-end="url(#image-note-arrow-en)"/>
    <text class="stage-title" x="77" y="65">1 · KRAMATORSK</text>
    <text class="stage-meta" x="673" y="65">2007–2022</text>
    <text class="primary" x="170" y="138.0"><tspan x="170" dy="0">Kindergarten</tspan></text>
    <text class="primary" x="395" y="138.0"><tspan x="395" dy="0">Preschool</tspan></text>
    <text class="primary" x="597.5" y="128.0"><tspan x="597.5" dy="0">School</tspan></text>
    <text class="secondary" x="597.5" y="154">grades 1–8</text>
    <text class="event-primary" x="375" y="304.0"><tspan x="375" dy="0">War started</tspan></text>
    <text class="event-secondary" x="375" y="330">24 FEB 2022</text>
    <text class="stage-title" x="77" y="435">2 · RELOCATION</text>
    <text class="stage-meta" x="673" y="435">2022</text>
    <text class="primary" x="220" y="501.0"><tspan x="220" dy="0">Romania</tspan></text>
    <text class="secondary" x="220" y="527">17 MAR · four months</text>
    <text class="primary" x="545" y="501.0"><tspan x="545" dy="0">Canada</tspan></text>
    <text class="secondary" x="545" y="527">8 JUN</text>
    <text class="stage-title" x="77" y="680">3 · CANADA</text>
    <text class="primary" x="180" y="750.0"><tspan x="180" dy="0">Nobleton</tspan></text>
    <text class="primary" x="565" y="750.0"><tspan x="565" dy="0">Newmarket</tspan></text>
    <text class="primary" x="222.5" y="879.0"><tspan x="222.5" dy="0">Sacred Heart CHS</tspan></text>
    <text class="secondary" x="222.5" y="905">2022–2026</text>
    <text class="destination-primary" x="550" y="879.0"><tspan x="550" dy="0">TMU</tspan></text>
    <text class="destination-secondary" x="550" y="905">NOW · Cyber Science</text>
  </g>
</svg>
