<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1120" role="img" aria-label="Життєвий шлях із Краматорська через Румунію та Канаду до TMU">
  <style>
    .line { fill: none; stroke: #a3a3a3; stroke-width: 1.6; }
    .line-strong { fill: none; stroke: #33373d; stroke-width: 2; }
    .node { fill: none; stroke: #33373d; stroke-width: 1.5; }
    .title { fill: #25282d; font-size: 26px; font-weight: 650; }
    .label { fill: #33373d; font-size: 19px; font-weight: 600; }
    .small { fill: #6b7280; font-size: 15px; }
    .date { fill: #33373d; font-size: 14px; font-weight: 650; letter-spacing: .04em; }
    .dot { fill: #33373d; }
    .arrow { fill: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #64676d; }
      .line-strong, .node { stroke: #c8ccd2; }
      .title, .label, .date, .dot { fill: #e6e8eb; }
      .small { fill: #9aa0aa; }
      .arrow { fill: #64676d; }
    }
  </style>
  <defs>
    <marker id="life-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path class="arrow" d="M0 0 L8 4 L0 8 Z" />
    </marker>
  </defs>

  <text class="title" x="260" y="38" text-anchor="middle">Мій шлях дотепер</text>
  <text class="small" x="260" y="62" text-anchor="middle">місця, навчання та поворотні моменти</text>
  <line class="line-strong" x1="55" y1="108" x2="55" y2="1062" />

  <circle class="dot" cx="55" cy="122" r="6" />
  <text class="date" x="88" y="118">2007–2022</text>
  <text class="label" x="88" y="145">Краматорськ</text>
  <text class="small" x="88" y="168">дім і початок навчання</text>

  <rect class="node" x="88" y="198" width="344" height="58" rx="16" />
  <text class="label" x="260" y="224" text-anchor="middle">Дитсадок</text>
  <text class="small" x="260" y="246" text-anchor="middle">перші заняття</text>
  <line class="line" x1="260" y1="258" x2="260" y2="282" marker-end="url(#life-arrow)" />

  <rect class="node" x="88" y="288" width="344" height="58" rx="16" />
  <text class="label" x="260" y="314" text-anchor="middle">Підготовка до школи</text>
  <text class="small" x="260" y="336" text-anchor="middle">наступний крок</text>
  <line class="line" x1="260" y1="348" x2="260" y2="372" marker-end="url(#life-arrow)" />

  <rect class="node" x="88" y="378" width="344" height="58" rx="16" />
  <text class="label" x="260" y="404" text-anchor="middle">Школа</text>
  <text class="small" x="260" y="426" text-anchor="middle">1–8 класи</text>

  <circle class="dot" cx="55" cy="484" r="6" />
  <text class="date" x="88" y="480">24 ЛЮТ 2022</text>
  <text class="label" x="88" y="507">Початок повномасштабної війни</text>
  <path class="line" d="M88 530 C170 548 252 512 334 530 S416 548 452 530" />

  <circle class="dot" cx="55" cy="604" r="6" />
  <text class="date" x="88" y="600">17 БЕР 2022</text>
  <text class="label" x="88" y="627">Румунія</text>
  <text class="small" x="88" y="650">тимчасовий дім на чотири місяці</text>
  <line class="line" x1="260" y1="666" x2="260" y2="694" marker-end="url(#life-arrow)" />

  <text class="date" x="88" y="716">8 ЧЕР 2022</text>
  <text class="label" x="88" y="743">Канада</text>
  <text class="small" x="88" y="766">новий початок</text>

  <rect class="node" x="88" y="800" width="150" height="56" rx="16" />
  <text class="label" x="163" y="835" text-anchor="middle">Ноблтон</text>
  <line class="line" x1="240" y1="828" x2="278" y2="828" marker-end="url(#life-arrow)" />
  <rect class="node" x="284" y="800" width="148" height="56" rx="16" />
  <text class="label" x="358" y="835" text-anchor="middle">Ньюмаркет</text>

  <circle class="dot" cx="55" cy="906" r="6" />
  <text class="date" x="88" y="902">2022–2026</text>
  <text class="label" x="88" y="929">Sacred Heart CHS</text>
  <text class="small" x="88" y="952">старша школа</text>
  <line class="line" x1="260" y1="962" x2="260" y2="990" marker-end="url(#life-arrow)" />

  <circle class="dot" cx="55" cy="1016" r="6" />
  <text class="date" x="88" y="1012">ЗАРАЗ</text>
  <rect class="node" x="88" y="1028" width="344" height="76" rx="18" />
  <text class="label" x="260" y="1059" text-anchor="middle">Торонтський столичний університет</text>
  <text class="small" x="260" y="1084" text-anchor="middle">Кібернаука</text>
</svg>
