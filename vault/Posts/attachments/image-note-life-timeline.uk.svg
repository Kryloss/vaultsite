    <rect class="node" x="55" y="96" width="205" height="92" rx="30"/>
    <rect class="node" x="300" y="96" width="175" height="92" rx="30"/>
    <rect class="node" x="515" y="96" width="180" height="92" rx="30"/>
    <rect class="stage" x="40" y="400" width="670" height="170" rx="22"/>
