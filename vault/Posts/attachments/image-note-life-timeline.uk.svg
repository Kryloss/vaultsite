<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" role="img" aria-label="Структурований життєвий шлях із Краматорська через Румунію та Канаду до TMU">
  <style>
    .panel { fill: #f5f5f4; stroke: #d6d6d3; stroke-width: 1.5; }
    .node { fill: #fff; stroke: #3f4248; stroke-width: 1.6; }
    .line { fill: none; stroke: #9a9da3; stroke-width: 2; }
    .line-strong { fill: none; stroke: #35383e; stroke-width: 2.4; }
    .title { fill: #25282d; font-size: 34px; font-weight: 650; }
    .phase { fill: #25282d; font-size: 27px; font-weight: 650; }
    .label { fill: #35383e; font-size: 25px; font-weight: 600; }
    .tight { font-size: 22px; }
    .small { fill: #6b7079; font-size: 19px; }
    .date { fill: #555a63; font-size: 18px; font-weight: 650; letter-spacing: .04em; }
    .event { fill: #35383e; font-size: 24px; font-weight: 600; }
    .dot { fill: #35383e; }
    .arrow { fill: #9a9da3; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #222326; stroke: #41444a; }
      .node { fill: #18191b; stroke: #c8ccd2; }
      .line { stroke: #656a72; }
      .line-strong { stroke: #d7d9dd; }
      .title, .phase, .label, .event, .dot { fill: #e7e9ec; }
      .small, .date { fill: #a3a8b1; }
      .arrow { fill: #656a72; }
    }
  </style>
  <defs>
    <marker id="life-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path class="arrow" d="M0 0 L9 5 L0 10 Z" />
    </marker>
  </defs>

  <text class="title" x="400" y="48" text-anchor="middle">Мій шлях дотепер</text>
  <text class="small" x="400" y="77" text-anchor="middle">місця, навчання та поворотні моменти</text>

  <rect class="panel" x="35" y="105" width="730" height="260" rx="24" />
  <text class="date" x="70" y="145">2007–2022</text>
  <text class="phase" x="70" y="181">Краматорськ</text>
  <text class="small" x="70" y="208">дім і початок навчання</text>

  <rect class="node" x="70" y="250" width="180" height="75" rx="18" />
  <text class="label" x="160" y="281" text-anchor="middle">Дитсадок</text>
  <text class="small" x="160" y="307" text-anchor="middle">перші заняття</text>
  <line class="line" x1="254" y1="288" x2="300" y2="288" marker-end="url(#life-arrow)" />
  <rect class="node" x="310" y="250" width="180" height="75" rx="18" />
  <text class="label" x="400" y="281" text-anchor="middle">Підготовка</text>
  <text class="small" x="400" y="307" text-anchor="middle">до школи</text>
  <line class="line" x1="494" y1="288" x2="540" y2="288" marker-end="url(#life-arrow)" />
  <rect class="node" x="550" y="250" width="180" height="75" rx="18" />
  <text class="label" x="640" y="281" text-anchor="middle">Школа</text>
  <text class="small" x="640" y="307" text-anchor="middle">1–8 класи</text>

  <circle class="dot" cx="70" cy="405" r="7" />
  <line class="line-strong" x1="70" y1="365" x2="70" y2="446" />
  <text class="date" x="105" y="397">24 ЛЮТ 2022</text>
  <text class="event" x="105" y="431">Початок повномасштабної війни</text>
  <path class="line" d="M525 412 C565 395 605 430 645 412 S705 395 730 412" />

  <rect class="panel" x="35" y="465" width="730" height="300" rx="24" />
  <text class="date" x="70" y="505">2022 · ВІД’ЇЗД ІЗ ДОМУ</text>

  <rect class="node" x="70" y="530" width="255" height="120" rx="18" />
  <text class="date" x="95" y="569">17 БЕР</text>
  <text class="label" x="95" y="601">Румунія</text>
  <text class="small" x="95" y="625">тимчасовий дім</text>
  <text class="small" x="95" y="646">чотири місяці</text>
  <line class="line" x1="330" y1="585" x2="385" y2="585" marker-end="url(#life-arrow)" />
  <rect class="node" x="395" y="535" width="335" height="100" rx="18" />
  <text class="date" x="420" y="569">8 ЧЕР</text>
  <text class="label" x="420" y="601">Канада</text>
  <text class="small" x="420" y="625">новий початок</text>

  <text class="small" x="70" y="685">новий дім</text>
  <rect class="node" x="180" y="655" width="190" height="70" rx="18" />
  <text class="label" x="275" y="699" text-anchor="middle">Ноблтон</text>
  <line class="line" x1="375" y1="690" x2="425" y2="690" marker-end="url(#life-arrow)" />
  <rect class="node" x="435" y="655" width="215" height="70" rx="18" />
  <text class="label" x="542" y="699" text-anchor="middle">Ньюмаркет</text>

  <rect class="panel" x="35" y="795" width="730" height="225" rx="24" />
  <text class="date" x="70" y="835">НАВЧАННЯ В КАНАДІ</text>

  <rect class="node" x="70" y="855" width="285" height="135" rx="18" />
  <text class="date" x="95" y="899">2022–2026</text>
  <text class="label" x="95" y="938">Sacred Heart CHS</text>
  <text class="small" x="95" y="968">старша школа</text>
  <line class="line" x1="360" y1="923" x2="410" y2="923" marker-end="url(#life-arrow)" />
  <rect class="node" x="420" y="855" width="310" height="135" rx="18" />
  <text class="date" x="445" y="899">ЗАРАЗ</text>
  <text class="label tight" x="445" y="934">Торонтський столичний</text>
  <text class="label tight" x="445" y="961">університет</text>
  <text class="small" x="445" y="984">Кібернаука</text>
</svg>
