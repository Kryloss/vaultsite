    <text class="stage-label" x="375" y="66">1 · КРАМАТОРСЬК · 2007–2022</text>
    <text class="node-label" style="font-size:29.0px" x="157.5" y="125.2"><tspan x="157.5" dy="0">Дитячий</tspan><tspan x="157.5" dy="33.6">садок</tspan></text>
    <text class="node-label" style="font-size:27.2px" x="387.5" y="126.2"><tspan x="387.5" dy="0">Дошкільна</tspan><tspan x="387.5" dy="31.6">підготовка</tspan></text>
    <text class="node-label" style="font-size:29.0px" x="605" y="125.2"><tspan x="605" dy="0">Школа</tspan><tspan x="605" dy="33.6">(1–8 класи)</tspan></text>
    <text class="stage-label" x="375" y="432">2 · ПЕРЕЇЗД · 2022</text>
    <text class="node-label" style="font-size:29.0px" x="235" y="482.2"><tspan x="235" dy="0">17 БЕР · Румунія</tspan><tspan x="235" dy="33.6">· чотири місяці</tspan></text>
    <text class="node-label" style="font-size:29.0px" x="560" y="482.2"><tspan x="560" dy="0">8 ЧЕР ·</tspan><tspan x="560" dy="33.6">Канада</tspan></text>
    <text class="stage-label" x="375" y="641">3 · МІСЦЯ В КАНАДІ</text>
    <text class="node-label" style="font-size:29.0px" x="230" y="697.0"><tspan x="230" dy="0">Ноблтон</tspan></text>
    <text class="node-label" style="font-size:29.0px" x="510" y="697.0"><tspan x="510" dy="0">Ньюмаркет</tspan></text>
    <text class="stage-label" x="375" y="827">4 · ОСВІТА В КАНАДІ</text>
    <text class="node-label" style="font-size:29.0px" x="230" y="877.2"><tspan x="230" dy="0">2022–2026 ·</tspan><tspan x="230" dy="33.6">Sacred Heart CHS</tspan></text>
    <text class="node-label" style="font-size:29.0px" x="560" y="877.2"><tspan x="560" dy="0">ЗАРАЗ · TMU</tspan><tspan x="560" dy="33.6">· Cyber Science</tspan></text>
    <text class="rupture-label" style="font-size:31.0px" x="375" y="297.0"><tspan x="375" dy="0">24 ЛЮТ 2022 · Почалася</tspan><tspan x="375" dy="36.0">війна</tspan></text>
