    <rect class="node" x="150" y="666" width="160" height="62" rx="30"/>
    <rect class="node" x="420" y="666" width="180" height="62" rx="30"/>
    <rect class="stage" x="40" y="795" width="670" height="170" rx="22"/>
    <rect class="node" x="80" y="856" width="300" height="76" rx="30"/>
    <rect class="node" x="450" y="856" width="220" height="76" rx="30"/>
    <rect class="node rupture" x="160" y="270" width="430" height="90" rx="45"/>
    <path class="path" d="M 268 142 L 290 142" marker-end="url(#image-note-arrow-uk)"/>
    <path class="path" d="M 483 142 L 505 142" marker-end="url(#image-note-arrow-uk)"/>
