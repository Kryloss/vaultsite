<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" role="img" aria-label="SY0-701 exam weight by domain: General Security Concepts 12%, Threats and Vulnerabilities 22%, Security Architecture 18%, Security Operations 28%, Security Program Management 20%.">
  <style>
    .lbl { fill: #33373d; font-size: 13px; font-weight: 500; }
    .val { fill: #33373d; font-size: 12px; font-weight: 700; }
    .foot{ fill: #6b7280; font-size: 11px; }
    .bar { fill: #d3d6db; }
    .barhi { fill: #33373d; }
    @media (prefers-color-scheme: dark) {
      .lbl { fill: #e6e8eb; }
      .val { fill: #f2f3f5; }
      .foot{ fill: #9aa0aa; }
      .bar { fill: #3a3e45; }
      .barhi { fill: #e6e8eb; }
    }
  </style>

  <text class="lbl" x="12" y="50">1 · General Security Concepts</text>
  <rect class="bar" x="252" y="35" width="171" height="22" rx="6" />
